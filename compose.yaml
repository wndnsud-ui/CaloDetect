services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: calodetect
      POSTGRES_USER: calodetect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calodetect -d calodetect"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://calodetect:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/calodetect
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.private-uploads:/workspace/.private-uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
