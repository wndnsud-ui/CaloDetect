services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calodetect_develop}
      POSTGRES_USER: ${POSTGRES_USER:-calodetect_develop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Run scripts/setup_local.ps1 first}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5174}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.private-uploads:/workspace/.private-uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
    name: calodetect_postgres_data
